<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>JWT 테스트</title>
</head>
<body>
  <h2>회원가입</h2>
  <input id="signup-email" placeholder="이메일">
  <input id="signup-password" type="password" placeholder="비밀번호">
  <input id="signup-nickname" placeholder="닉네임">
  <button onclick="signup()">회원가입</button>

  <h2>로그인</h2>
  <input id="login-email" placeholder="이메일">
  <input id="login-password" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>

  <h2>보호된 API 호출</h2>
  <button onclick="callProtected()">보호된 API 호출</button>

  <script>
    const BASE_URL = 'http://localhost:8080/api/users';
    let token = '';

    async function signup() {

      const res = await fetch(`${BASE_URL}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('signup-email').value,
          password: document.getElementById('signup-password').value,
          nickname: document.getElementById('signup-nickname').value
        })
      });

      if (res.ok) {
        alert("회원가입 성공!");
      } else {
        console.log(JSON.stringify({
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value,
        nickname: document.getElementById('signup-nickname').value
        }));
        alert("회원가입 실패");
      }
    }

    async function login() {
      const res = await fetch(`${BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        })
      });

      if (res.ok) {
        token = await res.text(); // 토큰 문자열 받기
        alert("로그인 성공! 토큰 발급됨");
        console.log("JWT Token:", token);
      } else {
        alert("로그인 실패");
      }
    }

    async function callProtected() {
      const res = await fetch('http://localhost:8080/api/protected', {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      const data = await res.text();
      alert(`서버 응답: ${data}`);

    }
  </script>
</body>
</html>
